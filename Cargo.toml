[package]
name = "vcc-i18n"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Standalone Windows launcher that localizes VRChat Creator Companion"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check version matches tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag must be vMAJOR.MINOR.PATCH, got $tag" }
          $cargo = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $ver = $cargo.Matches[0].Groups[1].Value
          if ("v$ver" -ne $tag) { throw "Cargo.toml version $ver does not match tag $tag" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Notes
        id: notes
        shell: pwsh
        run: |
          $body = & ./scripts/changelog-notes.ps1 -Version $env:GITHUB_REF_NAME
          $path = Join-Path $env:RUNNER_TEMP 'notes.md'
          $header = "Standalone Windows launcher that localizes VRChat Creator Companion.`n`nDownload ``vcc-i18n.exe``. No extra runtime.`n`n"
          Set-Content -LiteralPath $path -Value ($header + $body) -Encoding utf8
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/vcc-i18n.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
